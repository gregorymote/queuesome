services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: queuesome
      POSTGRES_USER: queuesome
      POSTGRES_PASSWORD: queuesome
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U queuesome -d queuesome"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - queuesome-postgres:/var/lib/postgresql/data

volumes:
  queuesome-postgres:
