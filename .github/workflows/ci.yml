name: CI

on:
  pull_request:
  push:
    branches: [stage, master]

permissions:
  contents: read

jobs:
  django:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: queuesome
          POSTGRES_USER: queuesome
          POSTGRES_PASSWORD: queuesome
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U queuesome -d queuesome"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DJANGO_ENV: development
      DJANGO_SECRET_KEY: ci-only-not-a-production-secret
      DATABASE_URL: postgresql://queuesome:queuesome@127.0.0.1:5432/queuesome
      MPLCONFIGDIR: /tmp/matplotlib
      PYTHONDONTWRITEBYTECODE: "1"

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version-file: .python-version
          cache: pip

      - name: Install dependencies
        run: python -m pip install --requirement requirements.txt

      - name: Run Django checks
        run: python manage.py check

      - name: Check application migration drift
        run: python manage.py makemigrations party blog spot --check --dry-run

      - name: Apply migrations
        run: python manage.py migrate --noinput

      - name: Check static assets
        run: python manage.py collectstatic --noinput

      - name: Run tests
        run: python manage.py test
